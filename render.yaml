# Blueprint de Render: web gratuita + Postgres gratuita (Frankfurt).
# Render > New > Blueprint > elige este repo. Te pedirá MENTOR_PASSWORD.
services:
  - type: web
    name: spaceapps-mentores
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: spaceapps-db
          property: connectionString
      - key: MENTOR_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: mentores.spaceappsvalencia.es,.onrender.com

databases:
  - name: spaceapps-db
    plan: free
    region: frankfurt
    databaseName: spaceapps
    user: spaceapps
